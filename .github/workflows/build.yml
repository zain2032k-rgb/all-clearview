name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python setup.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Diagnose
        run: |
          echo "--- files in root"; ls -la
          echo "--- settings.gradle"; cat settings.gradle || true
          echo "--- build.gradle (first 25 lines)"; head -25 build.gradle || true
          echo "--- java files"; find src -name "*.java" | sort
      - name: Build
        run: gradle build --console=plain
      - name: Show output
        run: ls -la build || true; ls -la build/libs || true
      - uses: actions/upload-artifact@v4
        with:
          name: clearview-client-jar
          path: build/libs/*.jar
          if-no-files-found: error
